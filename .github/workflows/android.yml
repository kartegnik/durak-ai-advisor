name: Android APK

on:
  push:
    branches:
      - main
      - codex/android-app
    paths:
      - "android/**"
      - "cv/assets/trump_suit_templates.npz"
      - "cv/scripts/export_android_assets.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify generated trump templates
        run: |
          python -m pip install numpy
          python cv/scripts/export_android_assets.py
          git diff --exit-code -- android/app/src/main/assets/trump_suit_templates.bin
      - name: Build and test
        working-directory: android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: durak-advisor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
